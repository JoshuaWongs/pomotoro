name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, stated rather than inherited: the job only ever reads the
# code. A pull request from a stranger runs with this too, so a fork cannot
# use the workflow to write to the repository.
permissions:
  contents: read

jobs:
  selftest:
    name: selftest (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Check tkinter is present
        run: python -c "import tkinter; print(tkinter.TkVersion)"

      - name: Self-test
        # Runners have no sound card, so the call into the audio device is
        # skipped. The waveform maths is still checked. See AGENTS.md.
        env:
          POMODORO_SKIP_AUDIO_CHECK: "1"
        run: python pomodoro.py --selftest

  # test_timer.py is intentionally absent: it measures beep drift against the
  # wall clock and drives real clicks, which flakes on a shared runner. It is
  # a local command, documented in the README.
